          ${visible ? `<line x1="${px}" y1="${topPad}" x2="${px}" y2="${handleY}" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" pointer-events="none"/>` : ""}
          <g pointer-events="none">
            <rect x="${pxClamped - pw / 2}" y="${topPad - 20}" width="${pw}" height="15" rx="4" fill="#475569"/>
            <text x="${pxClamped}" y="${topPad - 9}" text-anchor="middle" font-size="10" fill="#ffffff" style="user-select:none;font-family:inherit">${plabel}</text>
          </g>
          <g data-probe="1" style="cursor:ew-resize">
            <rect x="${pxClamped - 11}" y="${handleY + 1}" width="22" height="16" fill="transparent"/>
            <polygon points="${pxClamped},${handleY + 2} ${pxClamped - 6},${handleY + 13} ${pxClamped + 6},${handleY + 13}" fill="#475569" stroke="#ffffff" stroke-width="1.5" pointer-events="none"/>
          </g>`;
      }

      dom.ganttSvg.setAttribute("width", String(totalW));
      dom.ganttSvg.setAttribute("height", String(totalH));
      dom.ganttSvg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);
      dom.ganttSvg.innerHTML = `
        <defs>
          <clipPath id="${clipId}">
            <rect x="${labelW}" y="${topPad - 6}" width="${plotW}" height="${yTop + 10}"></rect>
          </clipPath>
        </defs>
        <rect x="0" y="0" width="${totalW}" height="${totalH}" fill="#fbfcfe"></rect>
        <rect x="${labelW}" y="${topPad}" width="${plotW}" height="${yTop}" fill="#ffffff" stroke="#d6dee9"></rect>
        ${tickLines}
        ${laneLines}
        ${recomputeLineMarkup}
        ${barMarkup}
        ${recomputeLabelMarkup}
        <line x1="${labelW}" y1="${topPad + yTop}" x2="${labelW + plotW}" y2="${topPad + yTop}" stroke="#718198" stroke-width="1.2"/>
        <text class="axis-title" x="${labelW + plotW / 2}" y="${totalH - 6}" text-anchor="middle">Time (s)</text>
        ${probeMarkup}
      `;

      attachBarEvents();
      attachChartPanZoom({ labelW, plotW, topPad, yTop });
      renderOverview(dataset, model);
      if (dataset.view.selected) renderDetails(dataset.view.selected);
      setStatus(`${dataset.name}: ${bars.length} visible blocks, ${lanes.length} lanes, ${fmt(dataset.view.t0)}-${fmt(dataset.view.t1)}s`);
    }

    function syncControlsLight(dataset) {
      dom.makespanValue.textContent = fmt(dataset.stats && dataset.stats.makespan);
      syncSearchControls(dataset);
      dom.probeTimeInput.value = fmt(state.probe.time);
      dom.hideDoorToggle.checked = dataset.view.hideDoor;
      dom.showRemovedMovesToggle.checked = dataset.view.showRemovedMoves;
      dom.durationOnlyToggle.checked = dataset.view.durationOnly;
      dom.showTimelineToggle.checked = dataset.view.showTimeline;
    }

    function hashCode(value) {
      let hash = 0;
      for (let i = 0; i < value.length; i += 1) {
        hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
      }
      return hash;
    }

    function attachBarEvents() {
      dom.ganttSvg.querySelectorAll(".bar").forEach((el) => {
        el.addEventListener("mouseenter", (event) => {
          const bar = state.visibleBars[Number(event.currentTarget.dataset.barIndex)];
          if (bar) showTooltip(event, bar);
        });
        el.addEventListener("mousemove", (event) => {
          if (dom.tooltip.classList.contains("visible")) positionTooltip(event);
        });
        el.addEventListener("mouseleave", hideTooltip);
        el.addEventListener("click", (event) => {
          event.stopPropagation();
          const dataset = activeDataset();
          const bar = state.visibleBars[Number(event.currentTarget.dataset.barIndex)];
          if (!dataset || !bar) return;
          dataset.view.selected = {
            rawIndex: bar.rec.rawIndex,
            bar
          };
          renderDetails(dataset.view.selected);
          renderCurrent();
        });
      });
    }

    function attachChartPanZoom(metrics) {
      dom.ganttSvg.onwheel = (event) => {
        const dataset = activeDataset();
        if (!dataset) return;
        const model = buildModel(dataset);
        const pt = svgPoint(dom.ganttSvg, event.clientX, event.clientY);
        if (pt.x < metrics.labelW || pt.x > metrics.labelW + metrics.plotW) return;
        event.preventDefault();
        const view = dataset.view;
        const span = view.t1 - view.t0;
        const cursorTime = view.t0 + ((pt.x - metrics.labelW) / metrics.plotW) * span;
        const factor = event.deltaY < 0 ? 0.82 : 1.22;
        const fullSpan = model.domainMax - model.domainMin;
        const nextSpan = Math.min(fullSpan, Math.max(Math.min(1, fullSpan), span * factor));
        const ratio = (cursorTime - view.t0) / span;
        view.t0 = cursorTime - nextSpan * ratio;
        view.t1 = view.t0 + nextSpan;
        clampView(dataset, model);
        renderCurrent();
      };

      dom.ganttSvg.onpointerdown = (event) => {
        const dataset = activeDataset();
        if (!dataset) return;
        if (event.target.closest && event.target.closest("[data-probe]")) {
          state.probeDrag = { startX: event.clientX, startTime: state.probe.time };
          dom.ganttSvg.classList.add("dragging");
          dom.ganttSvg.setPointerCapture(event.pointerId);
          return;
        }
        const pt = svgPoint(dom.ganttSvg, event.clientX, event.clientY);
        if (pt.x < metrics.labelW || pt.x > metrics.labelW + metrics.plotW || pt.y < metrics.topPad || pt.y > metrics.topPad + metrics.yTop) return;
        state.drag = {
          x: event.clientX,
          t0: dataset.view.t0,
          t1: dataset.view.t1,
          plotW: metrics.plotW
        };
        dom.ganttSvg.classList.add("dragging");
        dom.ganttSvg.setPointerCapture(event.pointerId);
      };

      dom.ganttSvg.onpointermove = (event) => {
        const dataset = activeDataset();
        if (!dataset) return;
        if (state.probeDrag) {
          const span = dataset.view.t1 - dataset.view.t0;
          const dx = event.clientX - state.probeDrag.startX;
          const dt = dx / metrics.plotW * span;
          state.probe.time = Math.max(dataset.view.t0, Math.min(dataset.view.t1, state.probeDrag.startTime + dt));
          renderCurrent();
          return;
        }
        if (!state.drag) return;
        const model = buildModel(dataset);
        const dx = event.clientX - state.drag.x;
        const span = state.drag.t1 - state.drag.t0;
        const shift = -dx / state.drag.plotW * span;
        dataset.view.t0 = state.drag.t0 + shift;
        dataset.view.t1 = state.drag.t1 + shift;
        clampView(dataset, model);
        renderCurrent();
      };

      dom.ganttSvg.onpointerup = (event) => {
        if (state.probeDrag) {
          state.probeDrag = null;
          dom.ganttSvg.classList.remove("dragging");
          try { dom.ganttSvg.releasePointerCapture(event.pointerId); } catch (_error) {}
          return;
        }
        if (state.drag) {
          state.drag = null;
          dom.ganttSvg.classList.remove("dragging");
          try {
            dom.ganttSvg.releasePointerCapture(event.pointerId);
          } catch (_error) {
            /* Pointer may already be released by the browser. */
          }
        }
      };

      dom.ganttSvg.onpointerleave = () => {
        if (state.probeDrag) {
          state.probeDrag = null;
          dom.ganttSvg.classList.remove("dragging");
          return;
        }
        if (!state.drag) return;
        state.drag = null;
        dom.ganttSvg.classList.remove("dragging");
      };
    }

    function svgPoint(svg, clientX, clientY) {
      const point = svg.createSVGPoint();
      point.x = clientX;
      point.y = clientY;
      return point.matrixTransform(svg.getScreenCTM().inverse());
    }

    function renderOverview(dataset, model) {
      dom.overviewSvg.innerHTML = "";
      return;
      const rect = dom.overviewSvg.getBoundingClientRect();
      const w = Math.max(420, Math.floor(rect.width || 800));
      const h = 58;
      const padL = 12;
      const padR = 12;
      const padT = 9;
      const barH = 24;
      const plotW = w - padL - padR;
      const domainSpan = Math.max(1e-9, model.domainMax - model.domainMin);
      const xFor = (t) => padL + (t - model.domainMin) / domainSpan * plotW;
      const enabledBars = model.bars;
      const sampleStep = Math.max(1, Math.ceil(enabledBars.length / 700));
      const overviewBars = enabledBars.filter((_bar, index) => index % sampleStep === 0).map((bar) => {
        const x0 = xFor(bar.start);
        const x1 = xFor(bar.end);
        const wBar = Math.max(1, x1 - x0);
        const color = effectiveMoveColor(bar);
        return `<rect x="${x0}" y="${padT + 7}" width="${wBar}" height="${barH}" fill="${color}" fill-opacity="0.45"></rect>`;
      }).join("");

      const winX0 = xFor(dataset.view.t0);
      const winX1 = xFor(dataset.view.t1);
      const winW = Math.max(3, winX1 - winX0);
      const tickStep = niceTickInterval(domainSpan, 6);
      const firstTick = Math.ceil(model.domainMin / tickStep) * tickStep;
      const ticks = [];
      for (let t = firstTick; t <= model.domainMax + tickStep * 0.5; t += tickStep) ticks.push(t);
      const tickMarkup = ticks.map((t) => {
        const x = xFor(t);
        return `<line x1="${x}" y1="${h - 19}" x2="${x}" y2="${h - 14}" stroke="#a7b4c5"/><text class="axis-label" x="${x}" y="${h - 4}" text-anchor="middle">${escapeHtml(fmt(t, 0))}</text>`;
      }).join("");

      dom.overviewSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      dom.overviewSvg.innerHTML = `
        <rect x="0" y="0" width="${w}" height="${h}" fill="#ffffff"></rect>
        <rect x="${padL}" y="${padT}" width="${plotW}" height="${barH + 14}" rx="5" fill="#f6f8fb" stroke="#e2e8f0"></rect>
        ${overviewBars}
        <rect class="overview-window" x="${winX0}" y="${padT + 1}" width="${winW}" height="${barH + 12}" rx="4"></rect>
        <rect class="overview-handle" data-handle="left" x="${winX0 - 3}" y="${padT + 1}" width="6" height="${barH + 12}" rx="2"></rect>
        <rect class="overview-handle" data-handle="right" x="${winX1 - 3}" y="${padT + 1}" width="6" height="${barH + 12}" rx="2"></rect>
        ${tickMarkup}
      `;

      dom.overviewSvg.onpointerdown = (event) => {
        const target = event.target;
        const pt = svgPoint(dom.overviewSvg, event.clientX, event.clientY);
        const handle = target && target.dataset ? target.dataset.handle : "";
        const timeAt = model.domainMin + ((pt.x - padL) / plotW) * domainSpan;
        if (handle) {
          state.overviewDrag = { handle, startX: event.clientX, startT0: dataset.view.t0, startT1: dataset.view.t1, plotW };
        } else {
          const span = dataset.view.t1 - dataset.view.t0;
          dataset.view.t0 = timeAt - span / 2;
          dataset.view.t1 = timeAt + span / 2;
          clampView(dataset, model);
          renderCurrent();
          state.overviewDrag = { handle: "move", startX: event.clientX, startT0: dataset.view.t0, startT1: dataset.view.t1, plotW };
        }
        dom.overviewSvg.setPointerCapture(event.pointerId);
      };

      dom.overviewSvg.onpointermove = (event) => {
        const current = activeDataset();
        if (!current || !state.overviewDrag) return;
        const currentModel = buildModel(current);
        const drag = state.overviewDrag;
        const dx = event.clientX - drag.startX;
        const dt = dx / drag.plotW * (currentModel.domainMax - currentModel.domainMin);
        if (drag.handle === "left") {
          current.view.t0 = Math.min(drag.startT1 - 1e-6, drag.startT0 + dt);
          current.view.t1 = drag.startT1;
        } else if (drag.handle === "right") {
          current.view.t0 = drag.startT0;
          current.view.t1 = Math.max(drag.startT0 + 1e-6, drag.startT1 + dt);
        } else {
          current.view.t0 = drag.startT0 + dt;
          current.view.t1 = drag.startT1 + dt;
        }
        clampView(current, currentModel);
        renderCurrent();
      };

      dom.overviewSvg.onpointerup = (event) => {
        state.overviewDrag = null;
        try {
          dom.overviewSvg.releasePointerCapture(event.pointerId);
        } catch (_error) {
          /* Pointer may already be released by the browser. */
        }
      };
    }

    /** 把原始 Move 字段格式化成悬浮提示中的文本。 */
    function formatTooltipValue(value) {
      if (value === null || value === undefined) return "";
      if (Array.isArray(value)) return value.length ? value.join(", ") : "[]";
      if (typeof value === "object") {
        try { return JSON.stringify(value); } catch (_e) { return String(value); }
      }
      return String(value);
    }

    /** 实际时间变化时，在值后追加原计划时间。 */
    function timeWithPlan(current, planned, estimated = false) {
      const display = fmt(current);
      const notes = [];
      if (estimated) notes.push("estimated");
      if (Number.isFinite(planned) && Math.abs(current - planned) > ZERO_DURATION_EPSILON_SECONDS) {
        notes.push(`raw ${fmt(planned)}`);
      }
      return notes.length ? `${display} (${notes.join(", ")})` : display;
    }

    /** 生成一行简短的动作内容，供悬浮提示末尾使用。 */
    function describeMove(raw) {
      const moveType = Number.parseInt(raw && raw.MoveType, 10);
      const actor = firstTooltipText(raw && raw.ModuleName, raw && raw.Robot, raw && raw.Station, raw && raw.RobotPort);
      const materials = tooltipMaterials(raw && raw.MatIDList);
      const source = tooltipLocation(
        raw && (raw.SrcStationList || raw.Source),
        raw && raw.SrcSlotList,
      );
      const destination = tooltipLocation(
        raw && (raw.DestStationList || raw.Destination),
        raw && raw.DestSlotList,
      );
      const robotSlots = tooltipList(raw && (raw.RobotSlotList || raw.SlotList));
      const slotText = robotSlots.length ? `用 slot ${robotSlots.join("、")}` : "";
      const prefix = actor ? `${actor} ` : "";
      switch (moveType) {
        case 0:
        case 2:
          return `${prefix}${slotText}${source ? ` 从 ${source}` : ""} ${moveType === 2 ? "同时取走" : "取走"}${materials || "物料"}`.trim();
        case 1:
        case 3:
          return `${prefix}${slotText ? `${slotText} ` : ""}将${materials || "物料"}${moveType === 3 ? "同时放入" : "放入"}${destination || "目标站点"}`.trim();
        case 4: {
          const station = firstTooltipText(raw && raw.StationList, raw && raw.Station);
          const received = tooltipMaterials(raw && raw.RecvMatList);
          const sent = tooltipMaterials(raw && raw.SendMatList);
          const source = tooltipLocation(raw && raw.StationList, raw && raw.StnSendSlotList) || station;
          const destination = tooltipLocation(raw && raw.StationList, raw && raw.StnRecvSlotList) || station;
          const receivedSlots = tooltipList(raw && raw.RecvSlotList);
          const sentSlots = tooltipList(raw && raw.SendSlotList);
          const robot = firstTooltipText(raw && raw.Robot, raw && raw.ModuleName, raw && raw.RobotPort) || "机械手";
          const receiveAction = `${receivedSlots.length ? `用 slot ${receivedSlots.join("、")} ` : ""}从 ${source || "站点"} 取出${received || "物料"}`;
          const sendAction = `${sentSlots.length ? `用 slot ${sentSlots.join("、")} ` : ""}将${sent || "物料"}放入${destination || "站点"}`;
          return `${robot} ${receiveAction}，再${sendAction}`;
        }
        case 5:
          return `${prefix}${source ? `从 ${source} ` : ""}旋转${destination ? `到 ${destination}` : ""}`.trim();
        case 6:
          return `${actor || "模块"}开门`;
        case 7:
        case 8:
          return `${actor || "模块"}关门`;
        case 9:
        case 14: {
          const slots = tooltipList(raw && raw.SlotList);
          const recipe = firstTooltipText(raw && raw.ProcessRecipe, raw && raw.CleanRecipe, raw && raw.RecipeName);
          const cleaning = moveType === 14 || (Array.isArray(raw && raw.MatIDList) && raw.MatIDList.length === 0);
          return `${actor || "模块"}${slots.length ? `在slot ${slots.join("、")}` : ""}${cleaning ? "执行清洁" : `对${materials || "物料"}执行工艺`}${recipe ? ` ${recipe}` : ""}`;
        }
        case 10:
          return `${prefix}${firstTooltipText(raw && raw.LastState) && firstTooltipText(raw && raw.CurState)
            ? `从 ${firstTooltipText(raw && raw.LastState)} 转换到 ${firstTooltipText(raw && raw.CurState)}`
            : "执行状态转换"}`.trim();
        case 11:
          return `${prefix}对${materials || "物料"}执行对准`.trim();
        default:
          return `${prefix}执行${S.MOVETYPE_NAMES[moveType] || "该动作"}`.trim();
      }
    }

    /** 将提示字段统一转成可拼接的字符串数组。 */
    function tooltipList(value) {
      if (value === null || value === undefined || value === "") return [];
      return (Array.isArray(value) ? value : [value]).map(String).filter(Boolean);
    }

    /** 从多个候选值中取第一个非空文本。 */
    function firstTooltipText(...values) {
      for (const value of values) {
        const text = value === null || value === undefined ? "" : String(value).trim();
        if (text) return text;
      }
      return "";
    }

    /** 把站点和槽位合并成 Move 描述中的位置文本。 */
    function tooltipLocation(stations, slots) {
      const stationList = tooltipList(stations);
      const slotList = tooltipList(slots);
      if (stationList.length && slotList.length && stationList.length === slotList.length) {
        return stationList.map((station, index) => `${station} slot ${slotList[index]}`).join("、");
      }
      if (stationList.length && slotList.length) return `${stationList.join("、")} slot ${slotList.join("、")}`;
      return stationList.join("、") || slotList.map((slot) => `slot ${slot}`).join("、");
    }

    /** 生成“物料 1、2”形式的描述片段。 */
    function tooltipMaterials(value) {
      const values = tooltipList(value);
      return values.length ? `物料${values.join("、")}` : "";
    }

    function showTooltip(event, bar) {
      const name = effectiveMoveName(bar);
      const raw = bar.rec.raw || {};
      const validation = bar.rec.invalid
        ? `<div style="color:#fca5a5;font-weight:700;margin-top:5px">校验失败：${escapeHtml(bar.rec.validationIssues.join("；") || "该 Move 未通过状态校验")}</div>`
        : "";
      const header = `
        <strong>${escapeHtml(name)}</strong>
        <div class="muted">${escapeHtml(bar.label)} | ${escapeHtml(fmt(bar.start))} - ${escapeHtml(fmt(bar.end))} s (${escapeHtml(timeWithPlan(bar.duration, bar.rec.planEnd - bar.rec.planStart))} s)</div>
        ${validation}
      `;
      const rows = Object.keys(raw).map((key) => {
        let value = formatTooltipValue(raw[key]);
        if (key === "StartTime" || key === "EndTime") {
          const current = key === "StartTime" ? bar.start : bar.end;
          const planned = key === "StartTime" ? bar.rec.planStart : bar.rec.planEnd;
          value = timeWithPlan(
            current,
            planned,
            key === "EndTime" && bar.rec.executed && !bar.rec.actualEndKnown
          );
        }
        return `<div><span class="muted">${escapeHtml(key)}:</span> ${escapeHtml(value)}</div>`;
      }).join("");
      const description = `<div class="tooltip-description">${escapeHtml(describeMove(raw))}</div>`;
      dom.tooltip.innerHTML = header + rows + description;
      positionTooltip(event);
      dom.tooltip.classList.add("visible");
    }

    function positionTooltip(event) {
      const margin = 14;
      const rect = dom.tooltip.getBoundingClientRect();
      let x = event.clientX + 12;
      let y = event.clientY + 12;
      if (x + rect.width + margin > window.innerWidth) x = event.clientX - rect.width - 12;
      if (y + rect.height + margin > window.innerHeight) y = event.clientY - rect.height - 12;
      dom.tooltip.style.left = `${Math.max(margin, x)}px`;
      dom.tooltip.style.top = `${Math.max(margin, y)}px`;
    }

    function hideTooltip() {
      dom.tooltip.classList.remove("visible");
    }

    function listValue(value) {
      if (Array.isArray(value)) return value.join(", ");
      if (value === undefined || value === null) return "";
      return String(value);
    }

    const _ppColorMap = new Map();
    const _PP_COLORS = ["#EAB308", "#F97316"];

    function prePrepareColor(raw) {
      const last = String((raw && raw.LastState) ?? "");
      const cur  = String((raw && raw.CurState)  ?? "");
      const key = `${last}|${cur}`;
      if (!_ppColorMap.has(key))
        _ppColorMap.set(key, _PP_COLORS[_ppColorMap.size % _PP_COLORS.length]);
      return _ppColorMap.get(key);
    }

    function isCleaningProcess(raw) {
      if (Number.parseInt(raw && raw.MoveType, 10) !== 9) return false;
      const materialIds = raw && raw.MatIDList;
      const explicitlyEmpty = Array.isArray(materialIds) && materialIds.length === 0;
      const cleanMetadata = [
        raw && raw.CleanRecipe,
        raw && raw.CleanTaskName,
        raw && raw.RecipeName
      ].some((value) => /clean|wac/i.test(String(value || "")));
      return explicitlyEmpty || cleanMetadata;
    }

    function effectiveMoveColor(bar) {
      if (isCleaningProcess(bar.rec.raw)) {
        return CLEAN_PROCESS_COLOR;
      }
      if (bar.moveType === 10) {
        return prePrepareColor(bar.rec.raw);
      }
      return S.MOVETYPE_COLORS[bar.moveType] || "#aaaaaa";
    }

    function effectiveMoveName(bar) {
      return S.MOVETYPE_NAMES[bar.moveType] || String(bar.moveType);
    }

    function contextButtonHtml(bar, label) {
      if (!bar) {
        return `<div class="context-empty">No ${escapeHtml(label.toLowerCase())} move.</div>`;
      }
      const name = S.MOVETYPE_NAMES[bar.moveType] || String(bar.moveType);
      return `
        <button class="context-button" type="button" data-jump-raw-index="${bar.rec.rawIndex}">
          <span class="context-time">${escapeHtml(fmt(bar.start))}-${escapeHtml(fmt(bar.end))}</span>
          <span class="context-name">${escapeHtml(label)}: ${escapeHtml(name)}</span>
          <span class="context-lane">${escapeHtml(bar.label)}</span>
        </button>`;
    }

    function bindDetailJumpButtons() {
      dom.detailBody.querySelectorAll("[data-jump-raw-index]").forEach((button) => {
        button.addEventListener("click", () => {
          const dataset = activeDataset();
          if (!dataset) return;
          const model = buildModel(dataset);
          const rawIndex = Number(button.dataset.jumpRawIndex);
          const target = model.bars.find((bar) => bar.rec.rawIndex === rawIndex);
          if (target) selectAndRevealBar(dataset, target, { zoom: true });
        });
      });
    }

    function renderDetails(selection) {
      if (!selection || !selection.bar) {
        clearDetails();
        return;
      }
      const dataset = activeDataset();
      const model = dataset ? buildModel(dataset) : null;
      const bar = model ? model.bars.find((item) => item.rec.rawIndex === selection.rawIndex) || selection.bar : selection.bar;
      const raw = bar.rec.raw;
      const name = effectiveMoveName(bar);
      const color = effectiveMoveColor(bar);
      const laneBars = model
        ? model.bars.filter((item) => item.lane === bar.lane).sort((a, b) => a.start - b.start || a.rec.rawIndex - b.rec.rawIndex)
        : [];
      const laneIndex = laneBars.findIndex((item) => item.rec.rawIndex === bar.rec.rawIndex);
      const prevLane = laneIndex > 0 ? laneBars[laneIndex - 1] : null;
      const nextLane = laneIndex >= 0 && laneIndex < laneBars.length - 1 ? laneBars[laneIndex + 1] : null;
      const waferIds = Array.isArray(raw.MatIDList) ? raw.MatIDList.map(String) : [];
      const waferPath = model && waferIds.length
        ? model.bars
            .filter((item) => {
              const ids = Array.isArray(item.rec.raw.MatIDList) ? item.rec.raw.MatIDList.map(String) : [];
              return waferIds.some((id) => ids.includes(id));
            })
            .sort((a, b) => a.start - b.start || a.rec.rawIndex - b.rec.rawIndex)
        : [];
      const waferIndex = waferPath.findIndex((item) => item.rec.rawIndex === bar.rec.rawIndex);
      const waferWindow = waferIndex >= 0
        ? waferPath.slice(Math.max(0, waferIndex - 3), Math.min(waferPath.length, waferIndex + 4))
        : waferPath.slice(0, 7);
      const rows = [
        ["StartTime", timeWithPlan(bar.start, bar.rec.planStart)],
        ["EndTime", timeWithPlan(bar.end, bar.rec.planEnd, bar.rec.executed && !bar.rec.actualEndKnown)],
        ["Duration", `${timeWithPlan(bar.duration, bar.rec.planEnd - bar.rec.planStart)} s`],
        ["MoveID", raw.MoveID],
        ["MoveType", `${bar.moveType} ${name}`],
        ["Lane", bar.label],
        ["ModuleName", raw.ModuleName],
        ["MatIDList", listValue(raw.MatIDList)],
        ["StepIDList", listValue(raw.StepIDList)],
        ["Source", raw.Source],
        ["Destination", raw.Destination],
        ["Robot", raw.Robot || raw.RobotPort],
        ["Station", raw.Station],
        ["SlotList", listValue(raw.SlotList || raw.RobotSlotList || raw.SrcSlotList || raw.DestSlotList)]
      ];
      const validationAlert = bar.rec.invalid
        ? `<div class="validation-alert"><strong>校验失败</strong><br>${escapeHtml(bar.rec.validationIssues.join("；") || "该 Move 未通过状态校验")}</div>`
        : "";
      const removedAlert = bar.rec.removedByRecompute
        ? `<div class="validation-alert"><strong>已由重算移除</strong><br>该 Move 仅用于展示失败前的旧计划，不属于可执行结果。</div>`
        : "";
      dom.detailBody.innerHTML = `
        ${validationAlert}
        ${removedAlert}
        <div class="detail-title">
          <span class="swatch" style="background:${escapeHtml(color)}"></span>
          <strong>${escapeHtml(name)}</strong>
        </div>
        ${rows.map(([key, value]) => `
          <div class="kv">
            <div class="k">${escapeHtml(key)}</div>
            <div class="v">${escapeHtml(value ?? "")}</div>
          </div>`).join("")}
        <div class="context-section">
          <div class="context-heading">Lane Context</div>
          <div class="context-list">
            ${contextButtonHtml(prevLane, "Previous")}
            ${contextButtonHtml(nextLane, "Next")}
          </div>
        </div>
        <div class="context-section">
          <div class="context-heading">Wafer Path${waferIds.length ? ` (${escapeHtml(waferIds.join(", "))})` : ""}</div>
          <div class="context-list">
            ${waferWindow.length
              ? waferWindow.map((item) => contextButtonHtml(item, item.rec.rawIndex === bar.rec.rawIndex ? "Current" : "Move")).join("")
              : `<div class="context-empty">No wafer path records found.</div>`}
          </div>
        </div>
      `;
      bindDetailJumpButtons();
    }

    function clearDetails() {
      const dataset = activeDataset();
      if (dataset) dataset.view.selected = null;
      state.selectedBar = null;
      dom.detailBody.innerHTML = `<div class="detail-empty">Select a block to inspect its timing and move fields.</div>`;
      renderCurrent();
    }

    function debounceRender() {
      window.clearTimeout(state.resizeTimer);
      state.resizeTimer = window.setTimeout(renderCurrent, 80);
    }

    /** 从一个或多个 src 查询参数读取 MoveList，并把每个结果作为独立标签页。 */
    async function loadQuerySource() {
      const params = new URLSearchParams(window.location.search);
      const sources = params.getAll("src"), names = params.getAll("name");
      if (!sources.length) return;
      const loaded = await Promise.allSettled(sources.map(async (source, index) => {
        const response = await fetch(source, { cache: "no-store" });
        if (!response.ok) throw new Error(`${names[index] || source}: HTTP ${response.status}`);
        const content = await response.blob();
        const safeName = String(names[index] || `scheduler-result-${index + 1}`)
          .replace(/[\\/:*?"<>|]+/g, "_");
        return new File([content], `${String(index + 1).padStart(2, "0")} · ${safeName}.json`, {
          type: "application/json",
          lastModified: Date.now() + index
        });
      }));
      const files = loaded.filter(item => item.status === "fulfilled").map(item => item.value);
      if (files.length) loadFileList(files, false);
      const failures = loaded.filter(item => item.status === "rejected");
      if (!files.length && failures.length) {
        renderEmpty(`Failed to load scheduler results: ${failures.map(item => item.reason?.message || item.reason).join("; ")}`);
      }
    }

    dom.pickFolderBtn.addEventListener("click", () => dom.folderInput.click());
    dom.pickFilesBtn.addEventListener("click", () => dom.filesInput.click());
    dom.folderInput.addEventListener("change", () => {
      loadFileList(dom.folderInput.files, true);
      dom.folderInput.value = "";
    });
    dom.filesInput.addEventListener("change", () => {
      loadFileList(dom.filesInput.files, false);
      dom.filesInput.value = "";
    });
    dom.fileSearch.addEventListener("input", renderFileList);
    dom.searchTypeSelect.addEventListener("change", () => {
      const dataset = activeDataset();
      if (!dataset) return;
      dataset.view.searchType = dom.searchTypeSelect.value;
      dataset.view.searchCursor = -1;
      syncSearchControls(dataset);
      renderCurrent();
    });
    dom.moveSearchInput.addEventListener("input", () => {
      const dataset = activeDataset();
      if (!dataset) return;
      dataset.view.searchQuery = dom.moveSearchInput.value;
      dataset.view.searchCursor = -1;
      renderCurrent();
    });
    dom.moveSearchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        jumpSearch(event.shiftKey ? -1 : 1);
      }
    });
    dom.prevSearchBtn.addEventListener("click", () => jumpSearch(-1));
    dom.nextSearchBtn.addEventListener("click", () => jumpSearch(1));
    dom.prevDiffBtn.addEventListener("click", () => jumpDiff(-1));
    dom.nextDiffBtn.addEventListener("click", () => jumpDiff(1));
    dom.durationOnlyToggle.addEventListener("change", () => {
      const dataset = activeDataset();
      if (!dataset) return;
      dataset.view.durationOnly = dom.durationOnlyToggle.checked;
      dataset.view.diffCursor = -1;
      dataset.view.selected = null;
      clearDetails();
      renderCurrent();
    });
    dom.setProbeTimeBtn.addEventListener("click", setProbeTimeFromInput);
    dom.probeTimeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") setProbeTimeFromInput();
    });
    dom.fitBtn.addEventListener("click", () => {
      const dataset = activeDataset();
      if (dataset) setFullRange(dataset);
    });
    dom.hideDoorToggle.addEventListener("change", () => {
      const dataset = activeDataset();
      if (!dataset) return;
      dataset.view.hideDoor = dom.hideDoorToggle.checked;
      dataset.view.t0 = null;
      dataset.view.t1 = null;
      dataset.view.selected = null;
      dataset.view.searchCursor = -1;
      clearDetails();
      syncControls(dataset);
      renderCurrent();
    });
    dom.showRemovedMovesToggle.addEventListener("change", () => {
      const dataset = activeDataset();
      if (!dataset) return;
      dataset.view.showRemovedMoves = dom.showRemovedMovesToggle.checked;
      dataset.view.t0 = null;
      dataset.view.t1 = null;
      dataset.view.selected = null;
      dataset.view.searchCursor = -1;
      clearDetails();
      syncControls(dataset);
      renderCurrent();
    });
    dom.showTimelineToggle.addEventListener("change", () => {
      const dataset = activeDataset();
      if (!dataset) return;
      dataset.view.showTimeline = dom.showTimelineToggle.checked;
      renderCurrent();
    });
    dom.clearSelectionBtn.addEventListener("click", clearDetails);
    dom.ganttSvg.addEventListener("click", () => {
      const dataset = activeDataset();
      if (!dataset || !dataset.view.selected) return;
      dataset.view.selected = null;
      clearDetails();
    });

    if (window.ResizeObserver) {
      new ResizeObserver(debounceRender).observe(dom.chartScroll);
      new ResizeObserver(debounceRender).observe(dom.overviewSvg);
    } else {
      window.addEventListener("resize", debounceRender);
    }

    loadQuerySource();

  </script>
</body>
</html>
