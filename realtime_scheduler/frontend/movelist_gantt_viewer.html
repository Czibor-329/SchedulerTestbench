<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movelist Gantt Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: #ffffff;
      --panel-soft: #f6f8fb;
      --panel-tint: #fbfcfe;
      --ink: #111827;
      --muted: #64748b;
      --muted-strong: #475569;
      --line: #cbd5e1;
      --line-soft: #e5eaf1;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --accent-soft: #e8f1ff;
      --accent-ring: rgba(37, 99, 235, 0.18);
      --danger: #b91c1c;
      --success: #059669;
      --warning: #d97706;
      --shadow: 0 16px 42px rgba(15, 23, 42, 0.10);
      --shadow-soft: 0 8px 22px rgba(15, 23, 42, 0.06);
      --radius: 8px;
      font-family: "Segoe UI", "Inter", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-width: 0;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, color 120ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: #9fb0c5;
      background: #f7f9fc;
      box-shadow: var(--shadow-soft);
      transform: translateY(-1px);
    }

    button:active {
      box-shadow: none;
      transform: translateY(0);
    }

    button:disabled {
      color: #94a3b8;
      background: #f4f7fa;
      border-color: #d9e0ea;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    button.icon {
      width: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    input[type="number"],
    input[type="search"],
    input[type="text"],
    select {
      height: 36px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      padding: 0 10px;
      min-width: 0;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
    }

    input[type="number"]:focus,
    input[type="search"]:focus,
    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    input:disabled {
      color: #94a3b8;
      background: #f5f7fa;
      border-color: #d9e0ea;
    }

    input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--accent);
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line-soft);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.03);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background:
        linear-gradient(135deg, #2563eb 0%, #14b8a6 100%);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
    }

    .brand-mark::before {
      top: 10px;
    }

    .brand-mark::after {
      bottom: 10px;
    }

    .brand-copy {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 750;
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      background: var(--bg);
    }

    .controls {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .sidebar,
    .details {
      min-height: 0;
      background: var(--panel);
      border-right: 1px solid var(--line-soft);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .details {
      border-right: 0;
      border-left: 1px solid var(--line-soft);
      grid-template-rows: auto 1fr;
    }

    .panel-heading {
      height: 50px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      gap: 10px;
      background: var(--panel-tint);
    }

    .panel-title {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--muted-strong);
    }

    .file-filter {
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
      background: #ffffff;
    }

    .file-filter input {
      width: 100%;
    }

    .file-list {
      overflow: auto;
      padding: 10px;
    }

    .file-tree {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .tree-folder {
      width: 100%;
      height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-strong);
      text-align: left;
      box-shadow: none;
      transform: none;
    }

    .tree-folder:hover {
      background: #f8fafc;
      border-color: var(--line-soft);
      box-shadow: none;
      transform: none;
    }

    .tree-chevron {
      width: 14px;
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 11px;
      line-height: 1;
      text-align: center;
    }

    .tree-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .tree-count {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .tree-children {
      display: grid;
      gap: 2px;
    }

    .file-item {
      width: 100%;
      height: auto;
      min-height: 38px;
      text-align: left;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      box-shadow: none;
      transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .tree-file {
      margin: 1px 0;
    }

    .file-item:hover {
      background: #f8fafc;
      border-color: var(--line-soft);
      box-shadow: none;
      transform: none;
    }

    .file-item.active {
      background: var(--accent-soft);
      border-color: #9ec5ff;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .file-meta {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      background: #ffffff;
    }

    .movelist-panel {
      min-height: 0;
    }

    .toolbar {
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 10px 12px;
      background: #ffffff;
      border-bottom: 1px solid var(--line-soft);
    }

    .toolbar-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
      justify-content: center;
    }

    .toolbar-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-file-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 0 0 auto;
      justify-content: center;
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
      min-height: 42px;
      padding: 4px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted-strong);
      font-size: 13px;
      white-space: nowrap;
      font-weight: 650;
    }

    .field input[type="number"] {
      width: 92px;
    }

    #makespanValue {
      color: var(--text-strong, #0f172a);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .field.search-field input {
      width: min(260px, 30vw);
    }

    .search-status {
      min-width: 46px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .diff-status {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .diff-status.warn {
      color: var(--warning);
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted-strong);
      font-size: 13px;
      white-space: nowrap;
      font-weight: 650;
    }

    .move-legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--panel-tint);
    }

    .move-legend:empty {
      display: none;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: #ffffff;
      color: var(--muted-strong);
      font-size: 12px;
      white-space: nowrap;
    }

    .stats-panel {
      display: none !important;
      min-height: 68px;
      max-height: 104px;
      overflow-x: hidden;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 8px;
      padding: 10px 12px;
      background: var(--panel-tint);
      border-bottom: 1px solid var(--line-soft);
    }

    .stats-panel:empty,
    .tabs:empty {
      display: none;
    }

    .stat-card {
      min-width: 0;
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      background: #ffffff;
      padding: 9px 10px;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.03);
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 650;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.15;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid rgba(15, 23, 42, 0.25);
      flex: 0 0 auto;
    }

    .tabs {
      min-height: 0;
      max-height: 74px;
      display: flex;
      align-content: flex-start;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg);
      overflow-x: hidden;
      overflow-y: auto;
      border-radius: var(--radius);
    }

    .tabs:empty {
      display: none;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      max-width: 320px;
      padding: 0 12px;
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      background: #edf2f7;
      color: var(--muted-strong);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab.active {
      background: #ffffff;
      color: var(--ink);
      border-color: var(--line);
      box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 rgba(15, 23, 42, 0.04);
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      width: 20px;
      height: 20px;
      border: 0;
      background: transparent;
      color: #64748b;
      border-radius: 4px;
      padding: 0;
      line-height: 18px;
    }

    .tab-close:hover {
      background: #e2e8f0;
      color: var(--ink);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chart-scroll {
      min-height: 0;
      overflow: hidden;
      position: relative;
      display: grid;
      place-items: stretch;
      background:
        linear-gradient(#ffffff 30%, rgba(255, 255, 255, 0)),
        linear-gradient(rgba(255, 255, 255, 0), #ffffff 70%) 0 100%,
        #fbfcfe;
      background-repeat: no-repeat;
      background-size: 100% 22px, 100% 22px, 100% 100%;
    }

    .chart-empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      padding: 24px;
      text-align: center;
      background: var(--panel-tint);
    }

    svg {
      display: block;
    }

    .gantt-svg {
      width: 100%;
      height: 100%;
      min-width: 0;
      cursor: grab;
      user-select: none;
    }

    .gantt-svg.dragging {
      cursor: grabbing;
    }

    .lane-label {
      fill: #1e293b;
      font-size: 13px;
      font-weight: 700;
    }

    .axis-label {
      fill: #334155;
      font-size: 12px;
    }

    .axis-title {
      fill: #475569;
      font-size: 12px;
      font-weight: 600;
    }

    .bar {
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transition: opacity 120ms ease;
    }

    .bar:hover {
      stroke: #0f172a;
      stroke-width: 2;
    }

    .bar.search-hit {
      stroke: #f59e0b;
      stroke-width: 4;
      stroke-opacity: 1 !important;
      filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.95));
    }

    .bar.search-hit.selected {
      stroke: #f59e0b;
      stroke-width: 4;
    }

    .bar.probe-hit {
      stroke: #1e3a8a;
      stroke-width: 2.2;
      stroke-opacity: 0.85 !important;
    }

    .bar.search-hit.probe-hit {
      stroke: #f59e0b;
      stroke-width: 4;
      stroke-opacity: 1 !important;
    }

    .bar.selected {
      stroke: #0f172a;
      stroke-width: 2.6;
      filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.22));
    }

    .bar.diff-selected {
      stroke: #dc2626;
      stroke-width: 3.5;
      stroke-opacity: 1 !important;
      filter: drop-shadow(0 0 8px rgba(220, 38, 38, 0.9));
    }

    .bar.invalid {
      stroke: #dc2626 !important;
      stroke-width: 4;
      stroke-opacity: 1 !important;
      filter: drop-shadow(0 0 5px rgba(220, 38, 38, 0.75));
    }

    .bar-invalid-label {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 900;
      pointer-events: none;
      user-select: none;
    }

    .bar-label {
      fill: #0f172a;
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    .overview {
      border-top: 1px solid var(--line-soft);
      background: var(--panel-tint);
      padding: 8px 12px 10px;
    }

    .overview-svg {
      width: 100%;
      height: 58px;
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      cursor: crosshair;
    }

    .overview-window {
      fill: rgba(37, 99, 235, 0.16);
      stroke: #2563eb;
      stroke-width: 1.6;
    }

    .overview-handle {
      fill: #2563eb;
      cursor: ew-resize;
    }

    .detail-body {
      min-height: 0;
      overflow: auto;
      padding: 14px;
    }

    .detail-empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 18px;
    }

    .detail-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel-tint);
    }

    .detail-title strong {
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .kv {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 8px 10px;
      padding: 9px 0;
      border-top: 1px solid var(--line-soft);
      font-size: 13px;
    }

    .kv .k {
      color: var(--muted);
      font-weight: 650;
    }

    .kv .v {
      color: #0f172a;
      overflow-wrap: anywhere;
    }

    .validation-alert {
      margin-bottom: 10px;
      padding: 9px 10px;
      border: 1px solid #fecaca;
      border-radius: 7px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .context-section {
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
      margin-top: 10px;
    }

    .context-heading {
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .context-list {
      display: grid;
      gap: 6px;
    }

    .context-button {
      width: 100%;
      height: auto;
      min-height: 34px;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 12px;
      background: #ffffff;
    }

    .context-button .context-name,
    .context-button .context-lane {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-button .context-time {
      color: var(--muted);
      white-space: nowrap;
    }

    .context-empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      overflow-wrap: anywhere;
      pointer-events: none;
      background: rgba(17, 24, 39, 0.96);
      color: #ffffff;
      border-radius: 7px;
      padding: 10px 11px;
      box-shadow: var(--shadow);
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      transform: translate(8px, 8px);
      transition: opacity 80ms ease;
    }

    .tooltip.visible {
      opacity: 1;
    }

    .tooltip .muted {
      color: #cbd5e1;
    }

    .tooltip-description {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
      color: #e2e8f0;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 620px;
    }

    .error {
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid var(--accent-ring);
      outline-offset: 2px;
    }

    ::selection {
      background: rgba(37, 99, 235, 0.18);
    }

    * {
      scrollbar-color: #b8c4d3 transparent;
      scrollbar-width: thin;
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: #c7d1df;
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: #aebccd;
      background-clip: padding-box;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .button-icon {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 5px;
      background: rgba(15, 23, 42, 0.08);
      position: relative;
    }

    button.primary .button-icon {
      background: rgba(255, 255, 255, 0.18);
    }

    .plus-icon::before,
    .plus-icon::after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: 8px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .plus-icon::after {
      left: 8px;
      right: auto;
      top: 5px;
      width: 2px;
      height: 8px;
    }

    .files-icon::before,
    .files-icon::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 11px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      background: #ffffff;
    }

    .files-icon::before {
      left: 4px;
      top: 3px;
      opacity: 0.55;
    }

    .files-icon::after {
      left: 6px;
      top: 5px;
    }

    .toolbar .icon {
      width: 36px;
      font-size: 16px;
    }

    .detail-empty,
    .chart-empty {
      line-height: 1.6;
    }

    @media (max-width: 1240px) {
      .layout {
        grid-template-rows: minmax(190px, 250px) minmax(0, 1fr);
      }

      .controls {
        grid-template-columns: minmax(230px, 260px) minmax(0, 1fr) minmax(260px, 300px);
      }

      .stats-panel {
        grid-template-columns: repeat(3, minmax(128px, 1fr));
        max-height: 150px;
      }
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .topbar {
        min-height: 64px;
        flex-wrap: wrap;
        align-content: center;
        padding: 10px 14px;
      }

      .layout {
        grid-template-rows: auto minmax(520px, 1fr);
        padding: 10px;
      }

      .controls {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar,
      .details {
        min-height: 220px;
        border-right: 0;
        border-left: 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .main {
        min-height: 320px;
      }

      .workspace {
        min-height: 520px;
      }

      .field.search-field input,
      .field input[type="search"] {
        width: min(100%, 260px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="layout">
      <section class="controls" aria-label="Viewer controls">
        <main class="main movelist-panel">
          <div class="toolbar">
            <div class="toolbar-rows">
              <div class="toolbar-row">
                <div class="toolbar-group">
                  <label class="field">Makespan <strong id="makespanValue">–</strong></label>
                  <button id="fitBtn" type="button" disabled>Fit</button>
                </div>
                <div class="toolbar-group">
                  <label class="field">Search by
                    <select id="searchTypeSelect" disabled>
                      <option value="moveId">Move ID</option>
                      <option value="materialId">Material ID</option>
                    </select>
                  </label>
                  <label class="field search-field"><span class="sr-only">Search value</span><input id="moveSearchInput" type="search" placeholder="Enter Move ID" disabled></label>
                  <button id="prevSearchBtn" type="button" disabled>Previous</button>
                  <button id="nextSearchBtn" type="button" disabled>Next</button>
                  <span id="searchStatus" class="search-status" aria-live="polite"></span>
                </div>
                <div class="toolbar-group">
                  <label class="field">Time line <input id="probeTimeInput" type="number" step="any" placeholder="Time" disabled></label>
                  <button id="setProbeTimeBtn" type="button" disabled>Locate</button>
                  <label class="switch" title="Show/hide the draggable time cursor"><input id="showTimelineToggle" type="checkbox" disabled> Show timeline</label>
                </div>
                <div class="toolbar-group" title="逐个跳转到实际执行时间与原计划不同的 Move">
                  <label class="field">Diff <strong id="diffStatus" class="diff-status">–</strong></label>
                  <button id="prevDiffBtn" type="button" disabled>Previous</button>
                  <button id="nextDiffBtn" type="button" disabled>Next</button>
                  <label class="switch" title="只保留执行时长改变的 Move，忽略等时长的整体平移"><input id="durationOnlyToggle" type="checkbox" disabled> Duration only</label>
                </div>
                <label class="switch"><input id="hideDoorToggle" type="checkbox" disabled> Hide door/pre-trans</label>
                <label class="switch"><input id="showRemovedMovesToggle" type="checkbox" checked disabled> Show removed moves</label>
              </div>
            </div>
            <div class="toolbar-file-btns">
              <button class="primary action-button" id="pickFolderBtn" type="button"><span class="button-icon plus-icon" aria-hidden="true"></span>Open Folder</button>
              <button class="action-button" id="pickFilesBtn" type="button"><span class="button-icon files-icon" aria-hidden="true"></span>Open Files</button>
              <input id="folderInput" class="hidden" type="file" webkitdirectory directory multiple accept=".json,application/json">
              <input id="filesInput" class="hidden" type="file" multiple accept=".json,application/json">
            </div>
          </div>
        </main>
      </section>

      <div class="tabs" id="tabs"></div>

      <section class="workspace" aria-label="Gantt chart">
        <div class="move-legend" id="moveLegend" aria-label="Move type legend"></div>
        <div class="chart-scroll" id="chartScroll">
          <div class="chart-empty" id="chartEmpty">Open a movelist file to render the chart.</div>
          <svg class="gantt-svg hidden" id="ganttSvg" role="img" aria-label="Movelist Gantt chart"></svg>
        </div>
      </section>
    </div>
  </div>

  <div class="hidden" aria-hidden="true">
    <input id="fileSearch" type="search" tabindex="-1">
    <div id="fileList"></div>
    <div class="stats-panel" id="statsPanel"></div>
    <svg class="overview-svg" id="overviewSvg" role="img" aria-label="Time range overview"></svg>
    <button class="icon" id="clearSelectionBtn" type="button">x</button>
    <div class="detail-body" id="detailBody"></div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="/assets/gantt_execution_compare.js"></script>
  <script>
    "use strict";

    const LANE_H = 28;
    const SUBLANE_H = 28;
    const LANE_GAP = 8;
    const SUBLANE_SUFFIX = "\u0000sub";
    const CL_GROUP_SUB_KEY = "CL" + SUBLANE_SUFFIX;
    const NO_SLOT_SPLIT_MODULES = new Set(["LP", "LP_done"]);
    const CLEAN_PROCESS_COLOR = "#38BDF8";
    const ZERO_DURATION_EPSILON_SECONDS = 1e-9;
    const ZERO_DURATION_MARKER_WIDTH = 3;

    const S = {
      MOVETYPE_NAMES: {
        0: "PICK", 1: "PLACE", 2: "MULTI_PICK", 3: "MULTI_PLACE", 4: "SWAP",
        5: "PRE_TRANS", 6: "PREPARE", 7: "COMPLETE", 8: "POST_COMPLETE", 9: "PROCESS",
        10: "PRE_PREPARE", 11: "ALIGN", 12: "PUMP", 13: "VENT", 14: "CLEAN"
      },
      MOVETYPE_COLORS: {
        0: "#C9437C", 1: "#E29B87", 2: "#84CC16", 3: "#A3E635", 4: "#C9A79B",
        5: "#94A3B8", 6: "#BEF264", 7: "#34D399", 8: "#FED7AA", 9: "#15803D",
        10: "#6EE7B7", 11: "#7C3AED", 12: "#EAB308", 13: "#F97316", 14: "#0284C7"
      },
      SWAP_MOVETYPE: 4,
      CHAMBER_MOVETYPES: new Set([6, 7, 9, 12, 13, 14]),
      HIDE_DOOR_PRE_TRAN_MOVETYPES: new Set([5, 6, 7]),
      ROBOT_SUBLANE_TYPES: new Set([5]),
      PM_SUBLANE_TYPES: new Set([6, 7]),
      CL_SUBLANE_TYPES: new Set([6, 7, 10]),
      PICK_MOVETYPES: new Set([0, 2]),
      PLACE_MOVETYPES: new Set([1, 3]),
      SWAP_MOVETYPES: new Set([4]),
      PROCESS_MOVETYPES: new Set([9])
    };

    const dom = {
      pickFolderBtn: document.getElementById("pickFolderBtn"),
      pickFilesBtn: document.getElementById("pickFilesBtn"),
      folderInput: document.getElementById("folderInput"),
      filesInput: document.getElementById("filesInput"),
      fileSearch: document.getElementById("fileSearch"),
      fileList: document.getElementById("fileList"),
      tabs: document.getElementById("tabs"),
      makespanValue: document.getElementById("makespanValue"),
      fitBtn: document.getElementById("fitBtn"),
      searchTypeSelect: document.getElementById("searchTypeSelect"),
      moveSearchInput: document.getElementById("moveSearchInput"),
      prevSearchBtn: document.getElementById("prevSearchBtn"),
      nextSearchBtn: document.getElementById("nextSearchBtn"),
      searchStatus: document.getElementById("searchStatus"),
      diffStatus: document.getElementById("diffStatus"),
      prevDiffBtn: document.getElementById("prevDiffBtn"),
      nextDiffBtn: document.getElementById("nextDiffBtn"),
      durationOnlyToggle: document.getElementById("durationOnlyToggle"),
      probeTimeInput: document.getElementById("probeTimeInput"),
      setProbeTimeBtn: document.getElementById("setProbeTimeBtn"),
      hideDoorToggle: document.getElementById("hideDoorToggle"),
      showRemovedMovesToggle: document.getElementById("showRemovedMovesToggle"),
      showTimelineToggle: document.getElementById("showTimelineToggle"),
      moveLegend: document.getElementById("moveLegend"),
      statsPanel: document.getElementById("statsPanel"),
      chartScroll: document.getElementById("chartScroll"),
      chartEmpty: document.getElementById("chartEmpty"),
      ganttSvg: document.getElementById("ganttSvg"),
      overviewSvg: document.getElementById("overviewSvg"),
      detailBody: document.getElementById("detailBody"),
      clearSelectionBtn: document.getElementById("clearSelectionBtn"),
      tooltip: document.getElementById("tooltip")
    };

    const state = {
      files: [],
      fileById: new Map(),
      openTabs: [],
      activeId: null,
      visibleBars: [],
      selectedBar: null,
      expandedDirs: new Set(),
      drag: null,
      overviewDrag: null,
      resizeTimer: 0,
      probe: { time: null },
      probeDrag: null
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmt(value, digits = 1) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "";
      if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
      return n.toFixed(digits).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
    }

    function fileSizeLabel(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function naturalParts(value) {
      return String(value).split(/(\d+)/).filter(Boolean).map((part) => {
        return /^\d+$/.test(part) ? Number(part) : part.toLowerCase();
      });
    }

    function naturalCompare(a, b) {
      const aa = naturalParts(a);
      const bb = naturalParts(b);
      const n = Math.max(aa.length, bb.length);
      for (let i = 0; i < n; i += 1) {
        if (aa[i] === undefined) return -1;
        if (bb[i] === undefined) return 1;
        if (aa[i] === bb[i]) continue;
        if (typeof aa[i] === "number" && typeof bb[i] === "number") return aa[i] - bb[i];
        return String(aa[i]).localeCompare(String(bb[i]));
      }
      return 0;
    }

    function baseModule(name) {
      return String(name || "").split("[")[0];
    }

    function isRobotModule(name) {
      const base = baseModule(name);
      return /^TM\d+$/.test(base) || /^(VTR|ATR)/i.test(base) || /robot/i.test(base);
    }

    function isPmModule(name) {
      return baseModule(name).startsWith("PM");
    }

    function isClModule(name) {
      const base = baseModule(name);
      return base === "CL" || base.startsWith("CL");
    }

    // heater/cooler: 多槽但每模块只占 1 行/1 sublane —— 不按槽位拆行
    function isHeaterCoolerModule(name) {
      return /^(heater|cooler|cool|heat)/i.test(baseModule(name));
    }

    // loadport: P1/P2/LP1/LP2/LP/LP_done 以及 DummyPort 等 *Port 变体 —— 不分槽位、无 sublane
    function isLoadPortModule(name) {
      const base = baseModule(name);
      if (/^(P\d+|LP\d*|LP_done)$/.test(base)) return true;
      // DummyPort 与 LoadPort 同等处理：凡是 dummy / xxPort 命名的端口都不按槽位拆行
      return /dummy/i.test(base) || /port\d*$/i.test(base);
    }

    // loadlock: LA-LD / LLA-LLD —— 不分槽位、无 sublane（先排除 LP* 避免误判）
    function isLoadLockModule(name) {
      if (isLoadPortModule(name)) return false;
      return /^LL?[A-Z]$/.test(baseModule(name));
    }

    function needsSublane(name) {
      return !isLoadPortModule(name) && !isLoadLockModule(name);
    }

    function laneHeight(lane) {
      return lane.endsWith(SUBLANE_SUFFIX) ? SUBLANE_H : LANE_H;
    }

    function stripSublaneSuffix(lane) {
      return lane.endsWith(SUBLANE_SUFFIX) ? lane.slice(0, -SUBLANE_SUFFIX.length) : lane;
    }

    function ytickLabelForLane(lane) {
      if (!lane.endsWith(SUBLANE_SUFFIX)) return lane;
      if (lane === CL_GROUP_SUB_KEY) return "CL-0";
      return `${stripSublaneSuffix(lane)}-0`;
    }

    function sublaneMoveTypesFor(baseLane, robotModules) {
      if (robotModules && robotModules.has(baseLane)) return S.ROBOT_SUBLANE_TYPES;
      if (isRobotModule(baseLane)) return S.ROBOT_SUBLANE_TYPES;
      if (isLoadPortModule(baseLane) || isLoadLockModule(baseLane)) return new Set();
      if (isPmModule(baseLane)) return S.PM_SUBLANE_TYPES;
      if (isClModule(baseLane)) return S.CL_SUBLANE_TYPES;
      return S.PM_SUBLANE_TYPES; // 未知模块(如 Cool) 按加工腔处理
    }

    function isHiddenDoorPreTranRecord(rec) {
      const mt = Number.parseInt(rec.MoveType, 10);
      if (S.HIDE_DOOR_PRE_TRAN_MOVETYPES.has(mt)) return true;
      const values = [rec.MoveType, rec.MoveTypeName, rec.Type, rec.ActionType];
      return values.some((value) => {
        const name = String(value ?? "").trim().toUpperCase().replace(/-/g, "_");
        return ["PRE_TRANS", "PRE_TRAN", "PREPARE", "COMPLETE"].includes(name);
      });
    }

    function normalizeRecord(rec, index) {
      const raw = rec.raw || rec;
      const { planStart, planEnd, start, end } = window.GanttExecutionCompare.resolveMoveTimes(rec);
      const mt = Number.parseInt(raw.MoveType, 10);
      return {
        raw,
        rawIndex: index,
        moveType: Number.isFinite(mt) ? mt : -1,
        module: String(raw.ModuleName ?? ""),
        start,
        end,
        duration: end - start,
        planStart,
        planEnd,
        executed: rec.executed !== false,
        actualEndKnown: rec.actualEndKnown !== false,
        aborted: rec.aborted === true,
        invalid: raw.ValidationFailed === true,
        removedByRecompute: raw.RemovedByRecompute === true,
        validationIssues: Array.isArray(raw.ValidationIssues)
          ? raw.ValidationIssues.map(String)
          : []
      };
    }

    // 多次重算统一文件中的竖线标记；兼容对象和纯数字时间两种紧凑格式。
    function normalizeRecomputePoint(point, index) {
      const rawTime = typeof point === "number" ? point : point && (point.Time ?? point.time);
      const time = Number(rawTime);
      const rawEffectiveTime = typeof point === "number"
        ? rawTime
        : point && (point.EffectiveTime ?? point.effectiveTime ?? rawTime);
      const effectiveTime = Number(rawEffectiveTime);
      const rawScheduleStart = typeof point === "number"
        ? rawTime
        : point && (point.ScheduleStartTime ?? point.scheduleStartTime ?? rawTime);
      const rawRecoveryEnd = typeof point === "number"
        ? rawEffectiveTime
        : point && (point.RecoveryEndTime ?? point.recoveryEndTime ?? rawEffectiveTime);
      const scheduleStartTime = Number(rawScheduleStart);
      const recoveryEndTime = Number(rawRecoveryEnd);
      const displayIndex = Number(point && (point.Index ?? point.index));
      return {
        time,
        effectiveTime: Number.isFinite(effectiveTime) ? effectiveTime : time,
        scheduleStartTime: Number.isFinite(scheduleStartTime) ? scheduleStartTime : time,
        recoveryEndTime: Number.isFinite(recoveryEndTime) ? recoveryEndTime : effectiveTime,
        index: Number.isFinite(displayIndex) ? displayIndex : index + 1,
        reason: String(point && (point.Reason ?? point.reason) || "重算")
      };
    }

    /**
     * 从 input_data 复现日志恢复完整甘特图数据。
     *
     * 每次 AlgOutput 仅代表当代计划。下一次 AlgSchedule 发起重算后，旧代中
     * 尚未开始的未来动作已被替换，只有开始时刻早于下一代排程时刻的动作应保留。
     * 因此不能只显示最后一个 AlgOutput，否则重算前的时间轴会直接丢失。
     *
     * @param {unknown[]} entries input_data 顶层日志条目。
     * @returns {{records: unknown[], recomputePoints: unknown[]}|null} 可绘制数据；不是复现日志时返回 null。
     */
    function reconstructInputLogMoveList(entries) {
      return window.GanttExecutionCompare.reconstructExecutionLog(entries);
    }

    /**
     * 统一提取普通 MoveList 与带多轮重算的 input_data 复现日志。
     *
     * @param {unknown} payload 上传 JSON 的已解析内容。
     * @returns {{records: unknown[], recomputePoints: unknown[], validation: unknown}|null} 可绘制数据。
     */
    function extractGanttPayload(payload) {
      if (Array.isArray(payload)) {
        const reconstructed = reconstructInputLogMoveList(payload);
        if (reconstructed) return { ...reconstructed, validation: null };
        return { records: payload, recomputePoints: [], validation: null };
      }
      if (payload && typeof payload === "object" && Array.isArray(payload.MoveList)) {
        return {
          records: payload.MoveList,
          recomputePoints: Array.isArray(payload.RecomputePoints) ? payload.RecomputePoints : [],
          validation: payload.Validation ?? null
        };
      }
      return null;
    }

    function findMultiSlotModules(records, lockModules) {
      const moduleSlots = new Map();
      for (const rec of records) {
        if (!S.CHAMBER_MOVETYPES.has(rec.moveType)) continue;
        const module = String(rec.raw.ModuleName ?? "");
        if (isLoadPortModule(module) || isLoadLockModule(module)) continue;
        if (lockModules && lockModules.has(module)) continue;
        const slotList = Array.isArray(rec.raw.SlotList) ? rec.raw.SlotList : [];
        if (!slotList.length) continue;
        const slot = Number.parseInt(slotList[0], 10);
        if (!Number.isFinite(slot)) continue;
        if (!moduleSlots.has(module)) moduleSlots.set(module, new Set());
        moduleSlots.get(module).add(slot);
      }
      const result = new Set();
      for (const [module, slots] of moduleSlots.entries()) {
        if (slots.size > 1) result.add(module);
      }
      return result;
    }

    function laneKey(rec, multiSlotModules) {
      if (S.SWAP_MOVETYPE !== null && rec.moveType === S.SWAP_MOVETYPE) {
        const robot = String(rec.raw.Robot ?? "");
        if (robot) return robot;
      }
      const module = String(rec.raw.ModuleName ?? "");
      if (multiSlotModules.has(module) && S.CHAMBER_MOVETYPES.has(rec.moveType)) {
        const slotList = Array.isArray(rec.raw.SlotList) ? rec.raw.SlotList : [];
        if (slotList.length) {
          const slot = Number.parseInt(slotList[0], 10);
          if (slot > 0) return `${module}[${slot}]`;
        }
      }
      return module;
    }

    function barLaneKey(rec, multiSlotModules, sublaneSet, laneSublaneMoveTypes) {
      const base = laneKey(rec, multiSlotModules);
      const subTypes = laneSublaneMoveTypes.get(base) || new Set();
      if (isClModule(base) && subTypes.has(rec.moveType) && sublaneSet.has(CL_GROUP_SUB_KEY)) {
        return CL_GROUP_SUB_KEY;
      }
      // heater/cooler 多槽：各槽位独立主 lane，但全模块共用 1 条 -0 门 sublane
      if (isHeaterCoolerModule(base) && subTypes.has(rec.moveType)) {
        const grp = baseModule(base) + SUBLANE_SUFFIX;
        if (sublaneSet.has(grp)) return grp;
      }
      const sub = base + SUBLANE_SUFFIX;
      if (sublaneSet.has(sub) && subTypes.has(rec.moveType)) {
        return sub;
      }
      return base;
    }

    function buildLaneOrder(records, multiSlotModules, robotModules, lockModules) {
      const allModules = new Set();
      for (const rec of records) {
        const key = laneKey(rec, multiSlotModules);
        if (key) allModules.add(key);
      }

      const mainOrder = Array.from(allModules).sort(naturalCompare);
      const tm1Index = mainOrder.indexOf("TM1");
      if (tm1Index >= 0) {
        mainOrder.splice(tm1Index, 1);
        mainOrder.unshift("TM1");
      }

      const clOrdered = mainOrder.filter(isClModule);
      const result = [];
      let clBlockEmitted = false;
      const hcSubEmitted = new Set();
      for (const main of mainOrder) {
        if (isClModule(main)) {
          if (!clBlockEmitted) {
            if (clOrdered.length) {
              result.push(CL_GROUP_SUB_KEY);
              result.push(...clOrdered);
            }
            clBlockEmitted = true;
          }
          continue;
        }
        const isLock = lockModules && lockModules.has(main);
        const noSublane = isLoadPortModule(main) || isLoadLockModule(main);
        if (isHeaterCoolerModule(main)) {
          // 每个槽位一条主 lane，但整模块只放 1 条 -0 门 sublane
          const grp = baseModule(main) + SUBLANE_SUFFIX;
          if (!isLock && !hcSubEmitted.has(grp)) {
            result.push(grp);
            hcSubEmitted.add(grp);
          }
          result.push(main);
          continue;
        }
        if (!isLock && !noSublane) result.push(main + SUBLANE_SUFFIX);
        result.push(main);
      }
      return result;
    }

    function buildModel(dataset) {
      const hideDoor = dataset.view.hideDoor;
      const showRemovedMoves = dataset.view.showRemovedMoves;
      const cacheKey = `${hideDoor ? "hidden" : "all"}-${showRemovedMoves ? "with-removed" : "without-removed"}`;
      if (dataset.models.has(cacheKey)) return dataset.models.get(cacheKey);

      // 零时长动作仍然代表真实状态边界和校验对象，必须进入绘制、搜索和详情模型。
      let records = dataset.records.filter((rec) => Number.isFinite(rec.start) && Number.isFinite(rec.end) && rec.end >= rec.start);
      if (hideDoor) records = records.filter((rec) => !isHiddenDoorPreTranRecord(rec.raw));
      if (!showRemovedMoves) records = records.filter((rec) => !rec.removedByRecompute);
      if (!records.length) {
        const empty = {
          records,
          laneOrder: [],
          yPos: new Map(),
          bars: [],
          presentMoveTypes: [],
          domainMin: 0,
          domainMax: 1,
          yTop: 0
        };
        dataset.models.set(cacheKey, empty);
        return empty;
      }

      const robotModules = new Set();
      const lockModules = new Set();
      for (const rec of records) {
        if (S.ROBOT_SUBLANE_TYPES.has(rec.moveType)) robotModules.add(rec.module);
        if (rec.moveType === 10) lockModules.add(rec.module);
      }

      const multiSlotModules = findMultiSlotModules(records, lockModules);
      const laneOrder = buildLaneOrder(records, multiSlotModules, robotModules, lockModules);
      const sublaneSet = new Set(laneOrder.filter((lane) => lane.endsWith(SUBLANE_SUFFIX)));
      const laneSublaneMoveTypes = new Map();
      for (const lane of laneOrder) {
        if (!lane.endsWith(SUBLANE_SUFFIX)) laneSublaneMoveTypes.set(lane, sublaneMoveTypesFor(lane, robotModules));
      }

      const yPos = new Map();
      let y = 0;
      for (const lane of laneOrder) {
        yPos.set(lane, y);
        y += laneHeight(lane) + LANE_GAP;
      }

      const bars = [];
      const present = new Set();
      for (const rec of records) {
        const lane = barLaneKey(rec, multiSlotModules, sublaneSet, laneSublaneMoveTypes);
        if (!yPos.has(lane)) continue;
        present.add(rec.moveType);
        bars.push({
          rec,
          lane,
          label: ytickLabelForLane(lane),
          start: rec.start,
          end: rec.end,
          duration: rec.duration,
          moveType: rec.moveType
        });
      }

      const lanesWithBars = new Set(bars.map((bar) => bar.lane));
      const finalLaneOrder = laneOrder.filter((lane) => lanesWithBars.has(lane));
      const finalYPos = new Map();
      let yFinal = 0;
      for (const lane of finalLaneOrder) {
        finalYPos.set(lane, yFinal);
        yFinal += laneHeight(lane) + LANE_GAP;
      }

      const starts = records.map((rec) => rec.start);
      const ends = records.map((rec) => rec.end);
      const model = {
        records,
        laneOrder: finalLaneOrder,
        yPos: finalYPos,
        bars,
        presentMoveTypes: Array.from(present).sort((a, b) => a - b),
        domainMin: Math.min(0, ...starts),
        domainMax: Math.max(...ends),
        yTop: y
      };
      dataset.models.set(cacheKey, model);
      return model;
    }

    function defaultView() {
      return {
        t0: null,
        t1: null,
        hideDoor: false,
        showRemovedMoves: true,
        showTimeline: false,
        laneFilter: "",
        selected: null,
        searchType: "moveId",
        searchQuery: "",
        searchCursor: -1,
        diffCursor: -1,
        durationOnly: false
      };
    }

    function makeFileRecord(file) {
      const path = file.webkitRelativePath || file.name;
      const id = `${path}|${file.size}|${file.lastModified}`;
      return {
        id,
        path,
        name: file.name,
        file,
        size: file.size,
        parsed: false,
        loading: false,
        error: "",
        records: [],
        recomputePoints: [],
        validation: null,
        models: new Map(),
        view: defaultView(),
        stats: null
      };
    }

    function loadFileList(fileList, preferMovelist) {
      const files = Array.from(fileList || []).filter((file) => /\.json$/i.test(file.name));
      const movelists = files.filter((file) => /_movelist\.json$/i.test(file.name));
      const selected = preferMovelist && movelists.length ? movelists : files;
      const records = selected.map(makeFileRecord).sort((a, b) => naturalCompare(a.path, b.path));

      state.files = records;
      state.fileById = new Map(records.map((item) => [item.id, item]));
      state.openTabs = [];
      state.activeId = null;
      state.selectedBar = null;
      state.visibleBars = [];
      state.expandedDirs = defaultExpandedDirs(records);
      state.openTabs = records.map((item) => item.id);
      renderTabs();
      renderEmpty(records.length ? "Select a movelist tab to render the chart." : "No JSON movelist files found.");
      clearDetails();
      setStatus(records.length ? `${records.length} file${records.length === 1 ? "" : "s"} loaded` : "No files loaded");

      if (records.length) activateTab(records[0].id);
    }

    async function ensureParsed(dataset) {
      if (dataset.parsed) return dataset;
      if (dataset.loading) return dataset;
      dataset.loading = true;
      dataset.error = "";
      renderFileList();
      try {
        const text = await dataset.file.text();
        const payload = JSON.parse(text);
        const ganttPayload = extractGanttPayload(payload);
        if (!ganttPayload) throw new Error("Expected a MoveList result or an input_data reproduction log.");
        dataset.records = ganttPayload.records.map(normalizeRecord);
        dataset.validation = ganttPayload.validation;
        const rawRecomputePoints = ganttPayload.recomputePoints;
        dataset.recomputePoints = rawRecomputePoints
          .map(normalizeRecomputePoint)
          .filter((point) => Number.isFinite(point.time));
        dataset.parsed = true;
        dataset.stats = {
          count: dataset.records.length,
          positive: dataset.records.filter((rec) => rec.end > rec.start + 1e-9).length,
          makespan: dataset.records.reduce(
            (max, rec) => (Number.isFinite(rec.end) ? Math.max(max, rec.end) : max),
            0
          )
        };
      } catch (error) {
        dataset.error = error instanceof Error ? error.message : String(error);
      } finally {
        dataset.loading = false;
        renderFileList();
      }
      return dataset;
    }

    function setStatus(_text) {
    }

    function splitPath(value) {
      return String(value || "").split(/[\\/]+/).filter(Boolean);
    }

    function defaultExpandedDirs(records) {
      const expanded = new Set();
      for (const item of records) {
        const parts = splitPath(item.path);
        parts.pop();
        const acc = [];
        for (const part of parts) {
          acc.push(part);
          expanded.add(acc.join("/"));
        }
      }
      return expanded;
    }

    function buildFileTree(files) {
      const root = { name: "", path: "", children: new Map(), files: [], count: 0 };
      for (const item of files) {
        const parts = splitPath(item.path);
        const fallbackName = item.name || item.path;
        const fileName = parts.pop() || fallbackName;
        let node = root;
        const acc = [];
        for (const part of parts) {
          acc.push(part);
          const dirPath = acc.join("/");
          if (!node.children.has(part)) {
            node.children.set(part, { name: part, path: dirPath, children: new Map(), files: [], count: 0 });
          }
          node = node.children.get(part);
        }
        node.files.push({ ...item, displayName: fileName });
      }

      function assignCounts(node) {
        let count = node.files.length;
        for (const child of node.children.values()) count += assignCounts(child);
        node.count = count;
        return count;
      }
      assignCounts(root);
      return root;
    }

    function renderFileTreeNode(node, depth, queryActive, activeId) {
      const dirNodes = Array.from(node.children.values())
        .sort((a, b) => naturalCompare(a.name, b.name));
      const fileNodes = node.files
        .slice()
        .sort((a, b) => naturalCompare(a.displayName || a.name, b.displayName || b.name));
      const chunks = [];

      for (const dir of dirNodes) {
        const expanded = queryActive || state.expandedDirs.has(dir.path);
        chunks.push(`
          <button class="tree-folder" type="button" data-dir-path="${escapeHtml(dir.path)}" style="padding-left:${8 + depth * 14}px" title="${escapeHtml(dir.path)}">
            <span class="tree-chevron" aria-hidden="true">${expanded ? "v" : ">"}</span>
            <span class="tree-name">${escapeHtml(dir.name)}</span>
            <span class="tree-count">${dir.count}</span>
          </button>`);
        if (expanded) {
          chunks.push(`<div class="tree-children">${renderFileTreeNode(dir, depth + 1, queryActive, activeId)}</div>`);
        }
      }

      for (const item of fileNodes) {
        const active = item.id === activeId ? " active" : "";
        let meta = item.path;
        if (item.loading) meta = "Loading...";
        if (item.error) meta = item.error;
        if (item.stats) meta = `${item.stats.count} records, ${item.stats.positive} drawable`;
        const errorClass = item.error ? " error" : "";
        chunks.push(`
          <button class="file-item tree-file${active}" type="button" data-file-id="${escapeHtml(item.id)}" style="padding-left:${10 + depth * 14}px" title="${escapeHtml(item.path)}">
            <span class="file-name">${escapeHtml(item.displayName || item.name)}</span>
            <span class="file-size">${escapeHtml(fileSizeLabel(item.size))}</span>
            <span class="file-meta${errorClass}">${escapeHtml(meta)}</span>
          </button>`);
      }

      return chunks.join("");
    }

    function renderFileList() {
      dom.fileList.innerHTML = "";
    }

    function renderTabs() {
      dom.tabs.innerHTML = state.openTabs.map((id) => {
        const item = state.fileById.get(id);
        if (!item) return "";
        const active = id === state.activeId ? " active" : "";
        return `
          <div class="tab${active}" data-tab-id="${escapeHtml(id)}" title="${escapeHtml(item.path)}">
            <span class="tab-title">${escapeHtml(item.name)}</span>
          </div>`;
      }).join("");
      dom.tabs.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", (event) => {
          if (event.target.closest(".tab-close")) return;
          activateTab(tab.dataset.tabId);
        });
      });
    }

    function openTab(id) {
      if (!state.fileById.has(id)) return;
      if (!state.openTabs.includes(id)) state.openTabs.push(id);
      activateTab(id);
    }

    async function activateTab(id) {
      if (!state.fileById.has(id)) return;
      state.activeId = id;
      state.selectedBar = null;
      renderTabs();
      renderFileList();
      setControlsEnabled(false);
      renderEmpty("Loading movelist...");
      const dataset = await ensureParsed(state.fileById.get(id));
      if (state.activeId !== id) return;
      if (dataset.error) {
        renderEmpty(dataset.error, true);
        clearDetails();
        setStatus(`Failed to load ${dataset.name}`);
        return;
      }
      setControlsEnabled(true);
      syncControls(dataset);
      const invalidBar = buildModel(dataset).bars.find((bar) => bar.rec.invalid);
      if (invalidBar) {
        selectAndRevealBar(dataset, invalidBar, { zoom: true });
        return;
      }
      renderCurrent();
    }

    function closeTab(id) {
      const index = state.openTabs.indexOf(id);
      if (index < 0) return;
      state.openTabs.splice(index, 1);
      if (state.activeId === id) {
        const next = state.openTabs[index] || state.openTabs[index - 1] || null;
        state.activeId = next;
        state.selectedBar = null;
        clearDetails();
        if (next) {
          activateTab(next);
        } else {
          renderTabs();
          renderFileList();
          setControlsEnabled(false);
          renderEmpty("Open a movelist file to render the chart.");
          setStatus(state.files.length ? `${state.files.length} file${state.files.length === 1 ? "" : "s"} loaded` : "No files loaded");
        }
      } else {
        renderTabs();
      }
    }

    function activeDataset() {
      return state.activeId ? state.fileById.get(state.activeId) : null;
    }

    function setControlsEnabled(enabled) {
      for (const el of [
        dom.fitBtn,
        dom.searchTypeSelect,
        dom.moveSearchInput,
        dom.prevSearchBtn,
        dom.nextSearchBtn,
        dom.prevDiffBtn,
        dom.nextDiffBtn,
        dom.durationOnlyToggle,
        dom.probeTimeInput,
        dom.setProbeTimeBtn,
        dom.hideDoorToggle,
        dom.showRemovedMovesToggle,
        dom.showTimelineToggle
      ]) {
        el.disabled = !enabled;
      }
    }

    function syncControls(dataset) {
      const model = buildModel(dataset);
      fitViewIfNeeded(dataset, model);
      dom.makespanValue.textContent = fmt(dataset.stats && dataset.stats.makespan);
      syncSearchControls(dataset);
      dom.probeTimeInput.value = fmt(state.probe.time);
      dom.hideDoorToggle.checked = dataset.view.hideDoor;
      dom.showRemovedMovesToggle.checked = dataset.view.showRemovedMoves;
      dom.durationOnlyToggle.checked = dataset.view.durationOnly;
      dom.showTimelineToggle.checked = dataset.view.showTimeline;
      renderMoveLegend(model);
    }

    function renderMoveLegend(model) {
      dom.moveLegend.innerHTML = model.presentMoveTypes.map((mt) => {
        const name = S.MOVETYPE_NAMES[mt] || String(mt);
        const color = S.MOVETYPE_COLORS[mt] || "#aaaaaa";
        return `
          <span class="legend-item" title="${escapeHtml(name)}">
            <span class="swatch" style="background:${escapeHtml(color)}"></span>
            <span>${escapeHtml(name)}</span>
          </span>`;
      }).join("");
    }

    function fitViewIfNeeded(dataset, model) {
      if (!Number.isFinite(dataset.view.t0) || !Number.isFinite(dataset.view.t1) || dataset.view.t1 <= dataset.view.t0) {
        dataset.view.t0 = model.domainMin;
        dataset.view.t1 = model.domainMax;
      }
      clampView(dataset, model);
    }

    function clampView(dataset, model) {
      const view = dataset.view;
      const min = model.domainMin;
      const max = model.domainMax;
      const fullSpan = Math.max(1e-9, max - min);
      let span = view.t1 - view.t0;
      if (!Number.isFinite(span) || span <= 0) span = fullSpan;
      span = Math.min(Math.max(span, Math.min(1, fullSpan)), fullSpan);
      if (view.t0 < min) {
        view.t0 = min;
        view.t1 = min + span;
      }
      if (view.t1 > max) {
        view.t1 = max;
        view.t0 = max - span;
      }
      if (view.t0 < min) view.t0 = min;
      if (view.t1 > max) view.t1 = max;
      if (view.t1 <= view.t0) {
        view.t0 = min;
        view.t1 = max;
      }
    }

    function setFullRange(dataset) {
      const model = buildModel(dataset);
      dataset.view.t0 = model.domainMin;
      dataset.view.t1 = model.domainMax;
      renderCurrent();
    }

    function visibleLaneOrder(dataset, model) {
      const query = dataset.view.laneFilter.trim().toLowerCase();
      if (!query) return model.laneOrder;
      return model.laneOrder.filter((lane) => {
        const label = ytickLabelForLane(lane);
        const base = stripSublaneSuffix(lane);
        return label.toLowerCase().includes(query) || base.toLowerCase().includes(query);
      });
    }

    function filteredBars(dataset, model, lanes) {
      const laneSet = new Set(lanes);
      const view = dataset.view;
      return model.bars.filter((bar) => {
        return laneSet.has(bar.lane) && bar.end >= view.t0 && bar.start <= view.t1;
      });
    }

    function syncSearchControls(dataset) {
      const type = dataset.view.searchType === "materialId" ? "materialId" : "moveId";
      dataset.view.searchType = type;
      dom.searchTypeSelect.value = type;
      dom.moveSearchInput.value = dataset.view.searchQuery;
      dom.moveSearchInput.placeholder = type === "materialId" ? "Enter Material ID" : "Enter Move ID";
    }

    function searchValues(bar, searchType) {
      const raw = bar.rec.raw;
      const values = searchType === "materialId"
        ? [raw.MatIDList, raw.MaterialID, raw.MaterialId, raw.MatID, raw.MatId]
        : [raw.MoveID, raw.MoveId, raw.Move_id];
      return values
        .flatMap((value) => Array.isArray(value) ? value : [value])
        .flatMap((value) => searchType === "materialId" && typeof value === "string" ? value.split(/[,;]+/) : [value])
        .filter((value) => value !== undefined && value !== null)
        .map((value) => String(value).trim().toLowerCase())
        .filter(Boolean);
    }

    function findSearchMatches(dataset, model, lanes) {
      const query = dataset.view.searchQuery.trim().toLowerCase();
      if (!query) return [];
      const laneSet = new Set(lanes);
      return model.bars
        .filter((bar) => laneSet.has(bar.lane))
        .filter((bar) => {
          return searchValues(bar, dataset.view.searchType).includes(query);
        })
        .sort((a, b) => a.start - b.start || naturalCompare(a.label, b.label) || a.rec.rawIndex - b.rec.rawIndex);
    }

    function updateSearchStatus(dataset, matches) {
      if (!dataset.view.searchQuery.trim()) {
        dom.searchStatus.textContent = "";
        return;
      }
      if (!matches.length) {
        dom.searchStatus.textContent = "No matches";
        return;
      }
      const current = dataset.view.searchCursor >= 0
        ? dataset.view.searchCursor + 1
        : 0;
      dom.searchStatus.textContent = `${current}/${matches.length}`;
    }

    function setProbeTimeFromInput() {
      const dataset = activeDataset();
      if (!dataset) return;
      const model = buildModel(dataset);
      const time = Number(dom.probeTimeInput.value);
      if (!Number.isFinite(time)) {
        dom.probeTimeInput.value = fmt(state.probe.time);
        return;
      }
      state.probe.time = Math.max(model.domainMin, Math.min(model.domainMax, time));
      dom.probeTimeInput.value = fmt(state.probe.time);

      if (state.probe.time < dataset.view.t0 || state.probe.time > dataset.view.t1) {
        const span = dataset.view.t1 - dataset.view.t0;
        dataset.view.t0 = state.probe.time - span / 2;
        dataset.view.t1 = state.probe.time + span / 2;
        clampView(dataset, model);
      }
      renderCurrent();
    }

    function clippedInterval(bar, t0, t1) {
      return [Math.max(t0, bar.start), Math.min(t1, bar.end)];
    }

    function mergeBusyTime(intervals) {
      const valid = intervals
        .filter(([a, b]) => Number.isFinite(a) && Number.isFinite(b) && b > a)
        .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      if (!valid.length) return 0;
      let total = 0;
      let [start, end] = valid[0];
      for (let i = 1; i < valid.length; i += 1) {
        const [a, b] = valid[i];
        if (a <= end) {
          end = Math.max(end, b);
        } else {
          total += end - start;
          start = a;
          end = b;
        }
      }
      return total + end - start;
    }

    function computeVisibleStats(dataset, lanes, bars) {
      const span = Math.max(1e-9, dataset.view.t1 - dataset.view.t0);
      const byLane = new Map(lanes.map((lane) => [lane, []]));
      const byType = new Map();
      let longest = null;
      for (const bar of bars) {
        const clipped = clippedInterval(bar, dataset.view.t0, dataset.view.t1);
        if (byLane.has(bar.lane)) byLane.get(bar.lane).push(clipped);
        const typeStats = byType.get(bar.moveType) || { count: 0, duration: 0 };
        typeStats.count += 1;
        typeStats.duration += Math.max(0, clipped[1] - clipped[0]);
        byType.set(bar.moveType, typeStats);
        if (!longest || bar.duration > longest.duration) longest = bar;
      }

      const laneStats = Array.from(byLane.entries()).map(([lane, intervals]) => {
        const busy = mergeBusyTime(intervals);
        return {
          lane,
          label: ytickLabelForLane(lane),
          busy,
          idle: Math.max(0, span - busy),
          util: busy / span
        };
      }).sort((a, b) => b.util - a.util || naturalCompare(a.label, b.label));

      const typeMix = Array.from(byType.entries()).map(([moveType, item]) => ({
        moveType,
        name: S.MOVETYPE_NAMES[moveType] || String(moveType),
        count: item.count,
        duration: item.duration
      })).sort((a, b) => b.duration - a.duration || b.count - a.count);

      const avgUtil = laneStats.length
        ? laneStats.reduce((sum, lane) => sum + lane.busy, 0) / (laneStats.length * span)
        : 0;
      return { span, laneStats, typeMix, avgUtil, longest };
    }

    function renderStatsPanel(dataset, lanes, bars) {
      dom.statsPanel.innerHTML = "";
      return;
      if (!dataset || !lanes.length) {
        dom.statsPanel.innerHTML = "";
        return;
      }
      const stats = computeVisibleStats(dataset, lanes, bars);
      const topLane = stats.laneStats[0];
      const idleLane = stats.laneStats.slice().sort((a, b) => b.idle - a.idle || naturalCompare(a.label, b.label))[0];
      const topTypes = stats.typeMix.slice(0, 3).map((item) => `${item.name}:${item.count}`).join(" | ") || "None";
      const longest = stats.longest;
      dom.statsPanel.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Window</div>
          <div class="stat-value">${escapeHtml(fmt(dataset.view.t0))}-${escapeHtml(fmt(dataset.view.t1))}s</div>
          <div class="stat-sub">${escapeHtml(fmt(stats.span))}s span</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Blocks</div>
          <div class="stat-value">${bars.length}</div>
          <div class="stat-sub">${lanes.length} lanes</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Utilization</div>
          <div class="stat-value">${escapeHtml(fmt(stats.avgUtil * 100, 1))}%</div>
          <div class="stat-sub">merged lane busy time</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Busiest</div>
          <div class="stat-value">${escapeHtml(topLane ? topLane.label : "None")}</div>
          <div class="stat-sub">${escapeHtml(topLane ? `${fmt(topLane.util * 100, 1)}% busy` : "")}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Most Idle</div>
          <div class="stat-value">${escapeHtml(idleLane ? idleLane.label : "None")}</div>
          <div class="stat-sub">${escapeHtml(idleLane ? `${fmt(idleLane.idle)}s idle` : "")}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Type Mix</div>
          <div class="stat-value" title="${escapeHtml(topTypes)}">${escapeHtml(topTypes)}</div>
          <div class="stat-sub">${escapeHtml(longest ? `${S.MOVETYPE_NAMES[longest.moveType] || longest.moveType} ${fmt(longest.duration)}s @ ${longest.label}` : "No blocks")}</div>
        </div>
      `;
    }

    function selectAndRevealBar(dataset, bar, options = {}) {
      if (!dataset || !bar) return;
      const model = buildModel(dataset);
      const currentSpan = Math.max(1, dataset.view.t1 - dataset.view.t0);
      const targetSpan = Math.min(currentSpan, Math.max(60, bar.duration * 12));
      const visible = bar.start >= dataset.view.t0 && bar.end <= dataset.view.t1;
      if (!visible || options.zoom) {
        const center = (bar.start + bar.end) / 2;
        const span = options.zoom ? targetSpan : currentSpan;
        dataset.view.t0 = center - span / 2;
        dataset.view.t1 = center + span / 2;
        clampView(dataset, model);
      }
      dataset.view.selected = {
        rawIndex: bar.rec.rawIndex,
        bar,
        diff: options.diff === true
      };
      renderDetails(dataset.view.selected);
      renderCurrent();
    }

    function jumpSearch(delta) {
      const dataset = activeDataset();
      if (!dataset) return;
      const model = buildModel(dataset);
      const lanes = visibleLaneOrder(dataset, model);
      const matches = findSearchMatches(dataset, model, lanes);
      if (!matches.length) {
        updateSearchStatus(dataset, matches);
        return;
      }
      dataset.view.searchCursor = dataset.view.searchCursor < 0
        ? (delta >= 0 ? 0 : matches.length - 1)
        : (dataset.view.searchCursor + delta + matches.length) % matches.length;
      updateSearchStatus(dataset, matches);
      selectAndRevealBar(dataset, matches[dataset.view.searchCursor]);
    }

    /** 收集实际时间与原计划不同的已执行 Move。 */
    function findDiffBars(model, durationOnly) {
      return model.bars
        .filter((bar) => window.GanttExecutionCompare.hasExecutionTimeDifference(bar.rec, durationOnly))
        .sort((left, right) => left.start - right.start || left.rec.rawIndex - right.rec.rawIndex);
    }

    /** 更新差异计数和跳转按钮。 */
    function updateDiffStatus(dataset, diffs) {
      const count = diffs.length;
      dom.prevDiffBtn.disabled = !count;
      dom.nextDiffBtn.disabled = !count;
      if (!count) {
        dom.diffStatus.textContent = "0";
        dom.diffStatus.classList.remove("warn");
        return;
      }
      const current = dataset.view.diffCursor >= 0 ? dataset.view.diffCursor + 1 : 0;
      dom.diffStatus.textContent = `${current}/${count}`;
      dom.diffStatus.classList.add("warn");
    }

    /** 按实际开始时间跳转到上一个或下一个差异 Move。 */
    function jumpDiff(delta) {
      const dataset = activeDataset();
      if (!dataset) return;
      const diffs = findDiffBars(buildModel(dataset), dataset.view.durationOnly);
      if (!diffs.length) {
        updateDiffStatus(dataset, diffs);
        return;
      }
      dataset.view.diffCursor = dataset.view.diffCursor < 0
        ? (delta >= 0 ? 0 : diffs.length - 1)
        : (dataset.view.diffCursor + delta + diffs.length) % diffs.length;
      updateDiffStatus(dataset, diffs);
      selectAndRevealBar(dataset, diffs[dataset.view.diffCursor], { zoom: true, diff: true });
    }

    function niceTickInterval(span, targetCount) {
      if (!Number.isFinite(span) || span <= 0) return 1;
      const raw = span / Math.max(1, targetCount);
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const scaled = raw / pow;
      const step = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10;
      return step * pow;
    }

    function renderEmpty(message, isError = false) {
      dom.chartEmpty.textContent = message;
      dom.chartEmpty.classList.toggle("error", isError);
      dom.chartEmpty.classList.remove("hidden");
      dom.ganttSvg.classList.add("hidden");
      dom.overviewSvg.innerHTML = "";
      dom.statsPanel.innerHTML = "";
      state.visibleBars = [];
    }

    function renderCurrent() {
      const dataset = activeDataset();
      if (!dataset || !dataset.parsed || dataset.error) return;
      const model = buildModel(dataset);
      syncControlsLight(dataset);
      renderMoveLegend(model);

      if (!model.records.length || !model.laneOrder.length) {
        renderEmpty("No records with positive duration.");
        setStatus(`${dataset.name}: no drawable records`);
        return;
      }

      const lanes = visibleLaneOrder(dataset, model);
      if (!lanes.length) {
        renderEmpty("No lanes match the current filter.");
        setStatus(`${dataset.name}: 0 visible lanes`);
        return;
      }

      clampView(dataset, model);
      dom.chartEmpty.classList.add("hidden");
      dom.ganttSvg.classList.remove("hidden");

      const labelW = 140;
      const rightPad = 18;
      const topPad = 34;
      const bottomPad = 46;
      const minPlotW = 680;
      const scrollRect = dom.chartScroll.getBoundingClientRect();
      const totalW = Math.max(minPlotW + labelW + rightPad, Math.floor(scrollRect.width || 900));
      const plotW = Math.max(minPlotW, totalW - labelW - rightPad);
      const chartH = Math.max(220, Math.floor(scrollRect.height || 520));
      const baseLaneUnits = lanes.reduce((acc, lane) => acc + laneHeight(lane), 0);
      const gapCount = Math.max(0, lanes.length - 1);
      const maxYTop = Math.max(90, chartH - topPad - bottomPad);
      const fitScale = Math.min(1, maxYTop / Math.max(1, baseLaneUnits + gapCount * LANE_GAP));
      const fitGap = Math.max(1, LANE_GAP * fitScale);
      const laneHeightFor = (lane) => Math.max(4, laneHeight(lane) * fitScale);
      const yTop = lanes.reduce((acc, lane, index) => {
        return acc + laneHeightFor(lane) + (index < lanes.length - 1 ? fitGap : 0);
      }, 0);
      const totalH = Math.max(180, topPad + yTop + bottomPad);
      const span = dataset.view.t1 - dataset.view.t0;
      const xScale = plotW / span;
      const clipId = `clip-${Math.abs(hashCode(dataset.id))}`;
      const laneY = new Map();
      let yCursor = 0;
      for (let index = 0; index < lanes.length; index += 1) {
        const lane = lanes[index];
        laneY.set(lane, yTop - yCursor - laneHeightFor(lane));
        yCursor += laneHeightFor(lane) + (index < lanes.length - 1 ? fitGap : 0);
      }

      if (state.probe.time === null) {
        state.probe.time = (dataset.view.t0 + dataset.view.t1) / 2;
        dom.probeTimeInput.value = fmt(state.probe.time);
      }

      const bars = filteredBars(dataset, model, lanes);
      state.visibleBars = bars;
      const searchMatches = findSearchMatches(dataset, model, lanes);
      if (dataset.view.searchCursor >= searchMatches.length) dataset.view.searchCursor = searchMatches.length - 1;
      const searchHitRawIndexes = new Set(searchMatches.map((bar) => bar.rec.rawIndex));
      updateSearchStatus(dataset, searchMatches);
      updateDiffStatus(dataset, findDiffBars(model, dataset.view.durationOnly));
      renderStatsPanel(dataset, lanes, bars);

      const tickStep = niceTickInterval(span, Math.max(5, Math.floor(plotW / 110)));
      const tickStart = Math.ceil(dataset.view.t0 / tickStep) * tickStep;
      const ticks = [];
      for (let t = tickStart; t <= dataset.view.t1 + tickStep * 0.5; t += tickStep) {
        ticks.push(t);
      }

      const laneLines = lanes.map((lane) => {
        const h = laneHeightFor(lane);
        const y = topPad + laneY.get(lane) + h / 2;
        const label = ytickLabelForLane(lane);
        const fontSize = Math.max(7, Math.min(13, h * 0.72));
        return `
          <line x1="${labelW}" y1="${y}" x2="${labelW + plotW}" y2="${y}" stroke="#e4ebf3" stroke-width="1"/>
          <text class="lane-label" x="${labelW - 12}" y="${y + fontSize / 3}" style="font-size:${fontSize}px" text-anchor="end">${escapeHtml(label)}</text>`;
      }).join("");

      const tickLines = ticks.map((t) => {
        const x = labelW + (t - dataset.view.t0) * xScale;
        return `
          <line x1="${x}" y1="${topPad - 4}" x2="${x}" y2="${topPad + yTop}" stroke="#edf3f9" stroke-width="1"/>
          <line x1="${x}" y1="${topPad + yTop}" x2="${x}" y2="${topPad + yTop + 5}" stroke="#718198" stroke-width="1"/>
          <text class="axis-label" x="${x}" y="${topPad + yTop + 20}" text-anchor="middle">${escapeHtml(fmt(t))}</text>`;
      }).join("");

      const probeInView = state.probe.time !== null && state.probe.time >= dataset.view.t0 && state.probe.time <= dataset.view.t1;
      const probeTime = state.probe.time;

      const visibleRecomputePoints = dataset.recomputePoints
        .filter((point) => point.time >= dataset.view.t0 && point.time <= dataset.view.t1);
      const recomputeLineMarkup = visibleRecomputePoints
        .map((point) => {
          const x = labelW + (point.time - dataset.view.t0) * xScale;
          return `<line class="recompute-marker" x1="${x}" y1="${topPad - 5}" x2="${x}" y2="${topPad + yTop}"
            stroke="#2563eb" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="7,4" pointer-events="none"/>`;
        }).join("");
      const recomputeLabelMarkup = visibleRecomputePoints
        .map((point) => {
          const x = labelW + (point.time - dataset.view.t0) * xScale;
          const label = `# ${point.index} (${fmt(point.time)} s)`;
          const labelWidth = Math.max(76, label.length * 6.4 + 16);
          const executionNote = Math.abs(point.recoveryEndTime - point.scheduleStartTime) > 1e-6
            ? `请求 ${fmt(point.time)}s · 新计划 ${fmt(point.scheduleStartTime)}s · 收尾结束 ${fmt(point.recoveryEndTime)}s`
            : `${fmt(point.time)}s`;
          return `
            <g class="recompute-marker-label" pointer-events="none">
              <rect x="${x - labelWidth / 2}" y="${topPad - 25}" width="${labelWidth}" height="17" rx="4" fill="#2563eb"/>
              <text x="${x}" y="${topPad - 13}" text-anchor="middle" font-size="10" fill="#ffffff"
                style="font-family:inherit">${escapeHtml(label)}</text>
              <title>${escapeHtml(`${label} · ${executionNote} · ${point.reason}`)}</title>
            </g>`;
        }).join("");

      const barMarkup = bars.map((bar, index) => {
        const y = topPad + laneY.get(bar.lane);
        const h = laneHeightFor(bar.lane);
        const x0 = labelW + (bar.start - dataset.view.t0) * xScale;
        const x1 = labelW + (bar.end - dataset.view.t0) * xScale;
        let x = Math.max(labelW, x0);
        let w = Math.max(1, Math.min(labelW + plotW, x1) - x);
        if (Math.abs(bar.end - bar.start) <= ZERO_DURATION_EPSILON_SECONDS) {
          // 以动作时刻为中心绘制最小宽度标记；视窗边界处向内收，避免被 clip-path 裁掉。
          const markerCenter = Math.max(labelW, Math.min(labelW + plotW, x0));
          w = Math.min(ZERO_DURATION_MARKER_WIDTH, plotW);
          x = Math.max(labelW, Math.min(labelW + plotW - w, markerCenter - w / 2));
        }
        const color = effectiveMoveColor(bar);
        const selected = dataset.view.selected && dataset.view.selected.rawIndex === bar.rec.rawIndex
          ? (dataset.view.selected.diff ? " diff-selected" : " selected")
          : "";
        const searchHit = searchHitRawIndexes.has(bar.rec.rawIndex) ? " search-hit" : "";
        const invalid = bar.rec.invalid ? " invalid" : "";
        const removed = bar.rec.removedByRecompute ? " removed" : "";
        const text = "";
        const radius = 2;
        const probeHit = dataset.view.showTimeline && probeInView && bar.start <= probeTime && bar.end >= probeTime;
        const fillOpacity = bar.rec.removedByRecompute ? "0.24" : "1";
        const strokeOpacity = bar.rec.removedByRecompute ? "0.45" : (probeHit ? "0.45" : "0.18");
        const probeClass = probeHit ? " probe-hit" : "";
        return `
          <g clip-path="url(#${clipId})">
            <rect class="bar${searchHit}${selected}${probeClass}${invalid}${removed}" data-bar-index="${index}" x="${x}" y="${y + 2}" width="${w}" height="${Math.max(1, h - 4)}"
              rx="${radius}" ry="${radius}" fill="${color}" fill-opacity="${fillOpacity}" stroke="#64748b" stroke-opacity="${strokeOpacity}" ${bar.rec.removedByRecompute ? 'stroke-dasharray="4,2"' : ""}></rect>
            ${bar.rec.invalid && w >= 8
              ? `<text class="bar-invalid-label" x="${x + Math.min(w / 2, 10)}" y="${y + h / 2 + 4}" text-anchor="middle">!</text>`
              : ""}
            ${text}
          </g>`;
      }).join("");

      const handleY = topPad + yTop;
      let probeMarkup = "";
      if (dataset.view.showTimeline && state.probe.time !== null) {
        const px = labelW + (state.probe.time - dataset.view.t0) * xScale;
        const pxClamped = Math.max(labelW, Math.min(labelW + plotW, px));
        const visible = px >= labelW && px <= labelW + plotW;
        // 数值标签放到顶部空白处（小药丸），与底部刻度数字/“Time (s)”互不相干
        const plabel = `${escapeHtml(fmt(state.probe.time))}s`;
        const pw = plabel.length * 6.4 + 14;
        probeMarkup = `
